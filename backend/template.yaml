AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Wayt Backend - API Gateway + Lambda (TypeScript) + DynamoDB

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        REPORTS_TABLE: !Ref VenueReportsTable
        USERS_TABLE: !Ref UserProfilesTable
        PROFILE_IMAGES_BUCKET: !Sub "wayt-profile-images-${AWS::AccountId}-${Stage}"
        SAVED_VENUES_TABLE: !Ref SavedVenuesTable
        SIGNALS_TABLE: !Ref WaytSignalsTable

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment stage (dev or prod)

  FoursquareApiKey:
    Type: String
    Default: ""
    Description: Foursquare Places API key (leave empty to disable Foursquare signals)
    NoEcho: true

  GooglePlacesApiKey:
    Type: String
    Default: ""
    Description: Google Places API key for operating hours (leave empty to disable)
    NoEcho: true

Resources:
  # -----------------------------------------------
  # API Gateway
  # -----------------------------------------------
  WaytApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt WaytUserPool.Arn
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 2000
          ThrottlingRateLimit: 1000
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # -----------------------------------------------
  # Lambda Functions
  # -----------------------------------------------
  SubmitReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/submitReport.handler
      Environment:
        Variables:
          LEADERBOARD_TABLE: !Ref WeeklyLeaderboardTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VenueReportsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WaytSignalsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WeeklyLeaderboardTable
      Events:
        PostReport:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /reports
            Method: POST
    Metadata:
      BuildMethod: makefile

  GetNearbyReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/getNearbyReports.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref VenueReportsTable
      Events:
        GetReports:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /reports
            Method: GET
            Auth:
              Authorizer: NONE  # Public: anonymous read access for nearby crowd reports
    Metadata:
      BuildMethod: makefile

  GetVenueReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/getVenueReports.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref VenueReportsTable
      Events:
        GetVenueReports:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /venues/{venueId}/reports
            Method: GET
            Auth:
              Authorizer: NONE  # Public: anonymous read access for venue-specific reports
    Metadata:
      BuildMethod: makefile

  GetUserProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/getUserProfile.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTable
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::wayt-profile-images-${AWS::AccountId}-${Stage}/profiles/*"
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /user/profile
            Method: GET
    Metadata:
      BuildMethod: makefile

  UpdateUserProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/updateUserProfile.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTable
      Events:
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /user/profile
            Method: PUT
    Metadata:
      BuildMethod: makefile

  GetProfileUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/getProfileUploadUrl.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTable
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:aws:s3:::wayt-profile-images-${AWS::AccountId}-${Stage}/profiles/*"
      Events:
        GetUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /user/profile/upload-url
            Method: GET
    Metadata:
      BuildMethod: makefile

  GetPublicProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/getPublicProfile.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTable
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::wayt-profile-images-${AWS::AccountId}-${Stage}/profiles/*"
      Events:
        GetPublicProfile:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /user/profile/{userId}/public
            Method: GET
    Metadata:
      BuildMethod: makefile

  # -----------------------------------------------
  # Saved Venues Lambda Functions
  # -----------------------------------------------
  SaveVenueFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/saveVenue.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SavedVenuesTable
      Events:
        SaveVenue:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /user/saved-venues
            Method: POST
    Metadata:
      BuildMethod: makefile

  UnsaveVenueFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/unsaveVenue.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SavedVenuesTable
      Events:
        UnsaveVenue:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /user/saved-venues/remove
            Method: POST
    Metadata:
      BuildMethod: makefile

  ListSavedVenuesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/listSavedVenues.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SavedVenuesTable
      Events:
        ListSavedVenues:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /user/saved-venues
            Method: GET
    Metadata:
      BuildMethod: makefile

  # -----------------------------------------------
  # Account Deletion
  # -----------------------------------------------
  DeleteAccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/deleteAccount.handler
      Timeout: 30
      Environment:
        Variables:
          USER_POOL_ID: !Ref WaytUserPool
          LEADERBOARD_TABLE: !Ref WeeklyLeaderboardTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VenueReportsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SavedVenuesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WeeklyLeaderboardTable
        - Statement:
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub "arn:aws:s3:::wayt-profile-images-${AWS::AccountId}-${Stage}/profiles/*"
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminDeleteUser
              Resource: !GetAtt WaytUserPool.Arn
      Events:
        DeleteAccount:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /user/account
            Method: DELETE
    Metadata:
      BuildMethod: makefile

  # -----------------------------------------------
  # Signal Fusion Engine — Lambda Functions
  # -----------------------------------------------
  GetNearbyVenuesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/getNearbyVenues.handler
      Timeout: 15
      Environment:
        Variables:
          FOURSQUARE_API_KEY: !Ref FoursquareApiKey
          GOOGLE_PLACES_API_KEY: !Ref GooglePlacesApiKey
          COLD_VENUES_FUNCTION: !Ref ComputeColdVenuesFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WaytSignalsTable
        - DynamoDBReadPolicy:
            TableName: !Ref VenueReportsTable
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt ComputeColdVenuesFunction.Arn
      Events:
        GetNearbyVenues:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /v1/venues/nearby
            Method: GET
            Auth:
              Authorizer: NONE  # Public: anonymous venue discovery (read-only)
        PostNearbyVenues:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /v1/venues/nearby
            Method: POST
            Auth:
              Authorizer: NONE  # Public: anonymous venue discovery with body payload (read-only)
    Metadata:
      BuildMethod: makefile

  ComputeColdVenuesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/computeColdVenues.handler
      Timeout: 120
      Environment:
        Variables:
          FOURSQUARE_API_KEY: !Ref FoursquareApiKey
          GOOGLE_PLACES_API_KEY: !Ref GooglePlacesApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WaytSignalsTable
        - DynamoDBReadPolicy:
            TableName: !Ref VenueReportsTable
    Metadata:
      BuildMethod: makefile

  GetVenueBusynessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/getVenueBusyness.handler
      Timeout: 15
      Environment:
        Variables:
          FOURSQUARE_API_KEY: !Ref FoursquareApiKey
          GOOGLE_PLACES_API_KEY: !Ref GooglePlacesApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WaytSignalsTable
        - DynamoDBReadPolicy:
            TableName: !Ref VenueReportsTable
      Events:
        GetVenueBusyness:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /v1/venues/{venueId}/busyness
            Method: GET
            Auth:
              Authorizer: NONE  # Public: anonymous single-venue busyness lookup
    Metadata:
      BuildMethod: makefile

  # -----------------------------------------------
  # Cognito
  # -----------------------------------------------
  WaytUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "wayt-userpool-${Stage}"
      UsernameAttributes:
        - email
        - phone_number
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        From: !Sub "Wayt <verify@getwayt.com>"
        SourceArn: !Sub "arn:aws:ses:ca-central-1:${AWS::AccountId}:identity/getwayt.com"
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: "Your Wayt verification code"
        EmailMessage: '<html><body style="margin:0;padding:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,''Segoe UI'',Roboto,sans-serif;"><table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:40px 0;"><tr><td align="center"><table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;"><tr><td style="background:linear-gradient(180deg,#FFE650,#FFD232);padding:28px;text-align:center;"><span style="color:#1a1a1a;font-size:26px;font-weight:800;letter-spacing:2px;">WAYT</span></td></tr><tr><td style="padding:32px 32px 16px;"><h2 style="margin:0 0 8px;color:#111111;font-size:20px;">Verify your email</h2><p style="margin:0;color:#111111;font-size:15px;line-height:1.5;">Enter this code in the app to complete your signup:</p></td></tr><tr><td style="padding:8px 32px 24px;"><div style="background:#FFD232;border-radius:8px;padding:16px;text-align:center;"><span style="font-size:32px;font-weight:700;letter-spacing:6px;color:#111111;">{####}</span></div></td></tr><tr><td style="padding:0 32px 32px;"><p style="margin:0;color:#111111;font-size:13px;line-height:1.4;">This code expires in 24 hours. If you didn''t create a Wayt account, you can safely ignore this email.</p></td></tr><tr><td style="background:#FFFAED;padding:16px 32px;text-align:center;border-top:1px solid #F0E8C8;"><p style="margin:0;color:#111111;font-size:12px;">Wayt - Know the wait before you leave.</p></td></tr></table></td></tr></table></body></html>'
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  WaytUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "wayt-app-client-${Stage}"
      UserPoolId: !Ref WaytUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  WaytIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub "wayt_identity_pool_${Stage}"
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref WaytUserPoolClient
          ProviderName: !GetAtt WaytUserPool.ProviderName

  WaytIdentityPoolAuthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref WaytIdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": authenticated
      Policies:
        - PolicyName: CognitoAuthorizedPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-sync:*
                  - cognito-identity:*
                Resource: "*"

  WaytIdentityPoolUnauthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref WaytIdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": unauthenticated

  WaytIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref WaytIdentityPool
      Roles:
        authenticated: !GetAtt WaytIdentityPoolAuthRole.Arn
        unauthenticated: !GetAtt WaytIdentityPoolUnauthRole.Arn

  # -----------------------------------------------
  # DynamoDB Tables
  # -----------------------------------------------
  VenueReportsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "VenueReports-${Stage}"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: venueId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
        - AttributeName: geohash
          AttributeType: S
      KeySchema:
        - AttributeName: venueId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GeohashIndex
          KeySchema:
            - AttributeName: geohash
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  UserProfilesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "UserProfiles-${Stage}"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  SavedVenuesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "SavedVenues-${Stage}"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: venueId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: venueId
          KeyType: RANGE

  # -----------------------------------------------
  # Weekly Leaderboard
  # -----------------------------------------------
  GetLeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/getLeaderboard.handler
      Environment:
        Variables:
          LEADERBOARD_TABLE: !Ref WeeklyLeaderboardTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref WeeklyLeaderboardTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTable
      Events:
        GetLeaderboard:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /leaderboard/nearby
            Method: GET
    Metadata:
      BuildMethod: makefile

  WeeklyLeaderboardTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "WeeklyLeaderboard-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: weekGeohash
          AttributeType: S
        - AttributeName: score
          AttributeType: N
      KeySchema:
        - AttributeName: weekGeohash
          KeyType: HASH
        - AttributeName: score
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # -----------------------------------------------
  # Signal Fusion Engine — DynamoDB Table
  # -----------------------------------------------
  WaytSignalsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "WaytSignals-${Stage}"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: geohash
          AttributeType: S
        - AttributeName: geoSK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GeohashIndex
          KeySchema:
            - AttributeName: geohash
              KeyType: HASH
            - AttributeName: geoSK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true



  # -----------------------------------------------
  # S3 — Profile Images
  # -----------------------------------------------
  # NOTE: If deploying to a new stage/account, this creates the bucket automatically.
  # For existing stacks where the bucket was created outside CloudFormation, import it
  # first: aws cloudformation import --stack-name <stack> --resources-to-import ...
  ProfileImagesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "wayt-profile-images-${AWS::AccountId}-${Stage}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT]
            AllowedOrigins: ["*"]
            MaxAge: 3600

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${WaytApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  VenueReportsTableName:
    Value: !Ref VenueReportsTable
  UserProfilesTableName:
    Value: !Ref UserProfilesTable
  ProfileImagesBucketName:
    Value: !Sub "wayt-profile-images-${AWS::AccountId}-${Stage}"
  SavedVenuesTableName:
    Value: !Ref SavedVenuesTable
  WaytSignalsTableName:
    Value: !Ref WaytSignalsTable
  WeeklyLeaderboardTableName:
    Value: !Ref WeeklyLeaderboardTable
  Stage:
    Value: !Ref Stage
  UserPoolId:
    Value: !Ref WaytUserPool
  UserPoolClientId:
    Value: !Ref WaytUserPoolClient
  IdentityPoolId:
    Value: !Ref WaytIdentityPool
