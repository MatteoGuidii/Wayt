AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Wayt Backend - API Gateway + Lambda (TypeScript) + DynamoDB

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        REPORTS_TABLE: !Ref VenueReportsTable
        USERS_TABLE: !Ref UserProfilesTable
        PROFILE_IMAGES_BUCKET: !Ref ProfileImagesBucket
        SAVED_VENUES_TABLE: !Ref SavedVenuesTable
        SIGNALS_TABLE: !Ref WaytSignalsTable

Parameters:
  CognitoUserPoolArn:
    Type: String
    Description: ARN of your Cognito User Pool (from Amplify)

  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment stage (dev or prod)

  FoursquareApiKey:
    Type: String
    Default: ""
    Description: Foursquare Places API key (leave empty to disable Foursquare signals)
    NoEcho: true

Resources:
  # -----------------------------------------------
  # API Gateway
  # -----------------------------------------------
  WaytApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref CognitoUserPoolArn
      Cors:
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # -----------------------------------------------
  # Lambda Functions
  # -----------------------------------------------
  SubmitReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/submitReport.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VenueReportsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WaytSignalsTable
      Events:
        PostReport:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /reports
            Method: POST
    Metadata:
      BuildMethod: makefile

  GetNearbyReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/getNearbyReports.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref VenueReportsTable
      Events:
        GetReports:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /reports
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: makefile

  GetVenueReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/getVenueReports.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref VenueReportsTable
      Events:
        GetVenueReports:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /venues/{venueId}/reports
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: makefile

  GetUserProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/getUserProfile.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTable
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${ProfileImagesBucket.Arn}/profiles/*"
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /user/profile
            Method: GET
    Metadata:
      BuildMethod: makefile

  UpdateUserProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/updateUserProfile.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTable
      Events:
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /user/profile
            Method: PUT
    Metadata:
      BuildMethod: makefile

  GetProfileUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/getProfileUploadUrl.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTable
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${ProfileImagesBucket.Arn}/profiles/*"
      Events:
        GetUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /user/profile/upload-url
            Method: GET
    Metadata:
      BuildMethod: makefile

  # -----------------------------------------------
  # Saved Venues Lambda Functions
  # -----------------------------------------------
  SaveVenueFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/saveVenue.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SavedVenuesTable
      Events:
        SaveVenue:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /user/saved-venues
            Method: POST
    Metadata:
      BuildMethod: makefile

  UnsaveVenueFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/unsaveVenue.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SavedVenuesTable
      Events:
        UnsaveVenue:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /user/saved-venues/remove
            Method: POST
    Metadata:
      BuildMethod: makefile

  ListSavedVenuesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/listSavedVenues.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SavedVenuesTable
      Events:
        ListSavedVenues:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /user/saved-venues
            Method: GET
    Metadata:
      BuildMethod: makefile

  # -----------------------------------------------
  # Signal Fusion Engine — Lambda Functions
  # -----------------------------------------------
  GetNearbyVenuesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/getNearbyVenues.handler
      Timeout: 15
      Environment:
        Variables:
          FOURSQUARE_API_KEY: !Ref FoursquareApiKey
          COLD_VENUES_FUNCTION: !Ref ComputeColdVenuesFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WaytSignalsTable
        - DynamoDBReadPolicy:
            TableName: !Ref VenueReportsTable
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt ComputeColdVenuesFunction.Arn
      Events:
        GetNearbyVenues:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /v1/venues/nearby
            Method: GET
            Auth:
              Authorizer: NONE
        PostNearbyVenues:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /v1/venues/nearby
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: makefile

  ComputeColdVenuesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/computeColdVenues.handler
      Timeout: 60
      Environment:
        Variables:
          FOURSQUARE_API_KEY: !Ref FoursquareApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WaytSignalsTable
        - DynamoDBReadPolicy:
            TableName: !Ref VenueReportsTable
    Metadata:
      BuildMethod: makefile

  GetVenueBusynessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: dist/getVenueBusyness.handler
      Timeout: 15
      Environment:
        Variables:
          FOURSQUARE_API_KEY: !Ref FoursquareApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WaytSignalsTable
        - DynamoDBReadPolicy:
            TableName: !Ref VenueReportsTable
      Events:
        GetVenueBusyness:
          Type: Api
          Properties:
            RestApiId: !Ref WaytApi
            Path: /v1/venues/{venueId}/busyness
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: makefile

  # -----------------------------------------------
  # DynamoDB Tables
  # -----------------------------------------------
  VenueReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "VenueReports-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: venueId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
        - AttributeName: geohash
          AttributeType: S
      KeySchema:
        - AttributeName: venueId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GeohashIndex
          KeySchema:
            - AttributeName: geohash
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  UserProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "UserProfiles-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  SavedVenuesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "SavedVenues-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: venueId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: venueId
          KeyType: RANGE

  # -----------------------------------------------
  # Signal Fusion Engine — DynamoDB Table
  # -----------------------------------------------
  WaytSignalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "WaytSignals-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: geohash
          AttributeType: S
        - AttributeName: geoSK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GeohashIndex
          KeySchema:
            - AttributeName: geohash
              KeyType: HASH
            - AttributeName: geoSK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # -----------------------------------------------
  # S3 Buckets
  # -----------------------------------------------
  ProfileImagesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "wayt-profile-images-${AWS::AccountId}-${Stage}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT]
            AllowedOrigins: ["*"]
            MaxAge: 300
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${WaytApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  VenueReportsTableName:
    Value: !Ref VenueReportsTable
  UserProfilesTableName:
    Value: !Ref UserProfilesTable
  ProfileImagesBucketName:
    Value: !Ref ProfileImagesBucket
  SavedVenuesTableName:
    Value: !Ref SavedVenuesTable
  WaytSignalsTableName:
    Value: !Ref WaytSignalsTable
  Stage:
    Value: !Ref Stage
